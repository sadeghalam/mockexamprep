{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5 signup-section">
    <h1 class="text-center mb-5">Sign Up</h1>
    <p class="text-center lead mb-5">Create an account to book mock exams and access practice question banks.</p>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="signup-form p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirm-password" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                    </div>
                </form>
                <p class="text-center mt-3">Already have an account? <a href="/login">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
